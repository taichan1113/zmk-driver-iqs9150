description: Azoteq IQS9150 capacitive trackpad controller

compatible: "azoteq,iqs9150"

include: i2c-device.yaml

properties:
  diagnostic-disable-lp-entry:
    type: boolean
    description: |
      Diagnostic only: zero the Idle-to-LP1 timeout word at 0x11B0 and verify
      readback before ATI. Retain Active/Idle Touch/Idle transitions, sampling
      and automatic reference management. Leave diagnostic-disable-mode-timeouts
      absent for this comparison; if both are set, active-only takes precedence.
      診断専用：IdleからLP1へのtimeoutのみ0にし、ATI前にreadback確認する。
      他のmode timeoutとsampling・自動reference管理は維持する。
  diagnostic-disable-mode-timeouts:
    type: boolean
    description: |
      Diagnostic only: set five automatic mode timeouts (0x11AC through 0x11B5)
      to zero and verify readback before ATI. Sampling periods, Event Mode and
      automatic reference management are unchanged. Battery consumption increases.
      診断専用：5つの自動mode timeoutを0にし、ATI前にreadback確認する。
      sampling・Event Mode・自動reference管理は維持。電池消費は増える。
  rdy-watch-ms:
    type: int
    default: 250
    description: GPIO-only runtime RDY level check interval; zero disables. Inactive event-mode silence does not force I2C or reset.
  runtime-diagnostics:
    type: boolean
    description: Emit a runtime health line every ten seconds with RDY, IRQ, report, error and rescue counters.
  rdy-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO connected to the IQS9150 RDY output. Specify GPIO_ACTIVE_LOW. RDY is active-low and
      open-drain. Put pull-up flags here only when the EV02 board does not
      provide the required external pull-up.
  two-finger-diagnostics:
    type: boolean
    description: |
      Emit throttled INFO logs of independent Finger 1/Finger 2 coordinates
      while two or more contacts are present. Intended for hardware validation.
  multitouch-diagnostics:
    type: boolean
    description: |
      Emit throttled INFO logs of all valid contacts while three or more
      contacts are present. Intended for multi-finger hardware validation.
